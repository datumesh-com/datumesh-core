[workspace]
resolver = "2"
members = ["crates/datumesh-core", "crates/datumesh-cli"]
exclude = ["fuzz", "wasm-smoke"]

[workspace.package]
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/datumesh-com/datumesh-core"

# Dependencies (curve25519 above all) are optimised even in test builds, so that the
# bit-flip tests, which verify tens of thousands of signatures, run in seconds.
[profile.dev.package."*"]
opt-level = 3
