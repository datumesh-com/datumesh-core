[package]
name = "datumesh-core"
version = "0.3.3"
description = "Datumesh protocol core: strict JSON and JCS, canonical forms, cell URIs, receipts, keys, envelopes and offline verification."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://datumesh.com"
documentation = "https://docs.rs/datumesh-core"
readme = "../../README.md"
keywords = ["datumesh", "receipt", "jcs", "ed25519", "verification"]
categories = ["cryptography", "encoding"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE"]

[features]
default = []
fetch = ["dep:ureq"]
# ReceiptBuilder and SigningKey: deterministic Ed25519 signing with the existing dependencies.
sign = []
# testkit: a conformance kit for Resolver implementations, with embedded fixtures.
testkit = []

[dependencies]
curve25519-dalek = { version = "5", default-features = false }
sha2 = { version = "0.11", default-features = false }
unicode-normalization = { version = "0.1.26", default-features = false }
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }

[dev-dependencies]
# Compile-fail tests: Receipt's fields and constructors are not reachable from outside.
trybuild = "1"

[package.metadata.docs.rs]
all-features = true
