name: release

# Publishes datumesh-core to crates.io when a tag v<version> is pushed: the test workflow must
# pass and the tag must equal the crate's version. Authentication is crates.io Trusted
# Publishing (OIDC); no long-lived token is stored in the repository.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag equals the crate version
        run: |
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/datumesh-core/Cargo.toml | head -n 1)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $GITHUB_REF_NAME, crate $crate"
          test "$tag" = "$crate"

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p datumesh-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
